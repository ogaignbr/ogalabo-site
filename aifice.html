<style>

  .stack .fig{ position:relative; margin:0; line-height:0; font-size:0; }
  .stack .fig img{ display:block; width:100%; height:auto; }

  /* ===== CTA(画像上に重ねる・ネオン発光) ===== */
  .cta{
    position:absolute; z-index:3; display:block; border-radius:999px; cursor:pointer;
    -webkit-tap-highlight-color:transparent; animation:ctaNeon 1.8s ease-in-out infinite;
  }
  @keyframes ctaNeon{
    0%,100%{ box-shadow:0 0 10px 2px rgba(63,216,182,.5), 0 0 28px 6px rgba(63,216,182,.30), inset 0 0 12px rgba(94,234,200,.18); }
    50%{ box-shadow:0 0 20px 4px rgba(120,255,230,.95), 0 0 50px 12px rgba(63,216,182,.6), 0 0 92px 20px rgba(63,216,182,.32), inset 0 0 18px rgba(94,234,200,.4); }
  }
  .cta.sm{ animation-name:ctaNeonSm; }
  @keyframes ctaNeonSm{
    0%,100%{ box-shadow:0 0 8px 1px rgba(63,216,182,.55), 0 0 20px 4px rgba(63,216,182,.32); }
    50%{ box-shadow:0 0 15px 2px rgba(120,255,230,.95), 0 0 34px 7px rgba(63,216,182,.55); }
  }
  .cta:hover{ transform:scale(1.02); box-shadow:0 0 26px 6px rgba(160,255,235,1), 0 0 70px 16px rgba(63,216,182,.65), inset 0 0 20px rgba(94,234,200,.45); }
  .cta:focus-visible{ outline:2px solid var(--mint-bright); outline-offset:3px; }

  /* ===== 流れ星 ===== */
  .stars{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:2; }
  .stars .s{ position:absolute; width:3px; height:3px; border-radius:50%; background:#eafcff;
    box-shadow:0 0 8px 2px rgba(150,225,255,.85); opacity:0;
    animation-name:shoot; animation-timing-function:linear; animation-iteration-count:infinite; }
  .stars .s::before{ content:""; position:absolute; top:50%; left:2px; width:150px; height:1.6px;
    transform:translateY(-50%); border-radius:2px;
    background:linear-gradient(90deg, rgba(190,240,255,.95), rgba(120,220,255,.18) 55%, transparent); }
  @keyframes shoot{
    0%{ transform:translate(0,0) rotate(-27deg); opacity:0; }
    3%{ opacity:1; } 15%{ opacity:1; }
    21%{ transform:translate(-1180px,600px) rotate(-27deg); opacity:0; }
    100%{ transform:translate(-1180px,600px) rotate(-27deg); opacity:0; }
  }
  .lp-mobile .stars .s::before{ width:110px; }

  /* ===== 表示切替 ===== */
  .lp-mobile{ display:none; }
  @media (max-width:768px){
    .lp-desktop{ display:none; }
    .lp-mobile{ display:block; }
  }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    .cta{ animation:none; box-shadow:0 0 16px 3px rgba(94,234,200,.8); }
    .stars{ display:none; }
  }
</style>
