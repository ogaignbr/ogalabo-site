  /* ===== CTA(画像上に重ねる・柔らかな浮遊演出) ===== */

    -webkit-tap-highlight-color:transparent; animation:ctaPulse 1.9s ease-in-out infinite;
  }
  @keyframes ctaPulse{
    0%,100%{ box-shadow:0 8px 20px rgba(30,70,60,.16); transform:translateY(0); }
    50%{ box-shadow:0 12px 30px rgba(30,70,60,.26), 0 0 20px 5px rgba(255,255,255,.55); transform:translateY(-1px); }
  }
  .cta.sm{ animation-name:ctaPulseSm; }
  @keyframes ctaPulseSm{
    0%,100%{ box-shadow:0 4px 12px rgba(30,70,60,.14); }
    50%{ box-shadow:0 8px 20px rgba(30,70,60,.24), 0 0 14px 3px rgba(255,255,255,.5); }
  }
  .cta:hover{ transform:scale(1.02); }
  .cta:focus-visible{ outline:2px solid var(--mint); outline-offset:3px; }

  /* ===== 表示切替 ===== */
  .lp-mobile{ display:none; }
  @media (max-width:768px){
    .lp-desktop{ display:none; }
    .lp-mobile{ display:block; }
  }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    .cta{ animation:none; box-shadow:0 8px 22px rgba(30,70,60,.22); }
  }
